{% load i18n %}
<div class="page-header">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="{% url 'core:home' %}">{% trans "Accueil" %}</a></li>
        {% if breadcrumb_parent %}<li class="breadcrumb-item"><a href="{{ breadcrumb_parent.url }}">{{ breadcrumb_parent.label }}</a></li>{% endif %}
        <li class="breadcrumb-item active" aria-current="page">{{ page_title }}</li>
      </ol>
    </nav>
    <h1 class="h2 mb-0">{{ page_title }}</h1>
    {% if page_subtitle %}<p class="mb-0 mt-2 opacity-75">{{ page_subtitle }}</p>{% endif %}
  </div>
</div>
