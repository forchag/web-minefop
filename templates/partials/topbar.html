{% load i18n %}
<div class="topbar py-2">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
    <span class="topbar-motto d-none d-md-inline">{% trans "Paix – Travail – Patrie" %}</span>
    <div class="d-flex flex-wrap align-items-center gap-3">
      <a href="{% url 'contact:contact' %}"><i class="bi bi-envelope me-1" aria-hidden="true"></i>{% trans "Contact" %}</a>
      <a href="{% url 'dashboard:home' %}"><i class="bi bi-shield-lock me-1" aria-hidden="true"></i>{% trans "Espace agent" %}</a>
      {% get_current_language as CURRENT_LANGUAGE %}
      {% get_available_languages as AVAILABLE_LANGUAGES %}
      <div class="lang-switch" role="group" aria-label="{% trans 'Choix de la langue' %}">
        {% for lang_code, lang_name in AVAILABLE_LANGUAGES %}
          <form action="{% url 'set_language' %}" method="post" class="d-inline">
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.get_full_path }}">
            <input name="language" type="hidden" value="{{ lang_code }}">
            <button type="submit" lang="{{ lang_code }}"
                    {% if lang_code == CURRENT_LANGUAGE %}aria-current="true"{% endif %}
                    title="{{ lang_name }}">
              {{ lang_code|upper }}<span class="visually-hidden"> — {{ lang_name }}</span>
            </button>
          </form>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
